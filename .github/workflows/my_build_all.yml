name: My Build All

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # No `release: published` trigger: publishing a release by hand (or with
  # gh using a personal token) would rebuild everything with the tag's
  # workflow files and re-attach assets to the existing release.

permissions:
  contents: write

concurrency:
  group: my-build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tag pushes publish a release, so fail before hours of builds if the
  # tag has no hand-written, user-facing notes in .github/release-notes/.
  check_release_notes:
    name: Check release notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/release-notes
            version.inc
      - name: Require notes file for the tag
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes" ]]; then
            echo "ERROR: $notes is missing or empty - commit user-facing release notes before tagging"
            exit 1
          fi
      - name: Require tag to match the version.inc release label
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          ver=$(sed -n 's/^set(SoftFever_VERSION "\(.*\)")/\1/p' version.inc)
          label=$(sed -n 's/^set(FORK_RELEASE_LABEL "\(.*\)")/\1/p' version.inc)
          if [[ "$GITHUB_REF_NAME" != "v${ver}-${label}" ]]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match version.inc (expected v${ver}-${label}) - bump FORK_RELEASE_LABEL before tagging"
            exit 1
          fi

  # Release the files that were tested: a tag publishes the artifacts of a
  # successful dispatch run of this workflow whose source equals the tagged
  # commit apart from .github/release-notes (notes are usually committed after
  # testing, and merging the PR makes a new commit with the same tree). Without
  # such a run (or once its artifacts expired) everything is built as before.
  find_tested_build:
    name: Find tested build
    needs: check_release_notes
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Look for a tested dispatch run of the same source
        id: find
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          while read -r id sha; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || continue
            git diff --quiet "$sha" "$GITHUB_SHA" -- . ':(exclude).github/release-notes' || continue
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" -q '[.artifacts[] | select(.expired | not)] | length')
            [[ "$live" -gt 0 ]] || continue
            run_id="$id"
            break
          done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow my_build_all.yml --event workflow_dispatch \
                     --status success --limit 50 --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            echo "Publishing the tested build from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No tested dispatch run matches $GITHUB_SHA; building everything" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build_windows:
    needs: find_tested_build
    if: ${{ needs.find_tested_build.outputs.run_id == '' }}
    uses: ./.github/workflows/build_windows_bridge.yml
    secrets: inherit

  build_linux_portable:
    needs: find_tested_build
    if: ${{ needs.find_tested_build.outputs.run_id == '' }}
    uses: ./.github/workflows/build_linux_portable.yml
    secrets: inherit

  build_linux_appimage:
    needs: find_tested_build
    if: ${{ needs.find_tested_build.outputs.run_id == '' }}
    uses: ./.github/workflows/build_linux_appimage.yml
    secrets: inherit

  build_rpm_fedora:
    needs: find_tested_build
    if: ${{ needs.find_tested_build.outputs.run_id == '' }}
    uses: ./.github/workflows/build_rpm_fedora.yml
    secrets: inherit

  # macOS disabled for now (expensive, only Windows/Linux x86_64 can be
  # tested) - uncomment build_macos and re-add it to publish_release's
  # needs below to restore.
  # build_macos:
  #   uses: ./.github/workflows/build_macos_bridge.yml
  #   secrets: inherit

  publish_release:
    name: Publish release assets
    needs:
      - find_tested_build
      - build_windows
      - build_linux_portable
      - build_linux_appimage
      - build_rpm_fedora
    # The builds are skipped when a tested run is published, so check results
    # explicitly instead of relying on the default success() condition.
    if: >-
      !cancelled() && github.event_name == 'push' && needs.find_tested_build.result == 'success' &&
      (needs.find_tested_build.outputs.run_id != '' ||
       (needs.build_windows.result == 'success' && needs.build_linux_portable.result == 'success' &&
        needs.build_linux_appimage.result == 'success' && needs.build_rpm_fedora.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/release-notes

      - name: Download the tested build's artifacts
        if: ${{ needs.find_tested_build.outputs.run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          run-id: ${{ needs.find_tested_build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download all artifacts
        if: ${{ needs.find_tested_build.outputs.run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # Bridge runtime artifacts are build inputs already bundled into the
      # Windows packages, and per-job checksum files are replaced by a single
      # SHA256SUMS.txt covering exactly the published files.
      - name: Flatten release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-artifacts -type f \
            ! -path 'release-artifacts/linux_host_runtime_*' \
            ! -path 'release-artifacts/wsl_rootfs_*' \
            ! -name 'SHA256SUMS*' -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/"$(basename "$file")"
          done
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          ls -lah release-files

      # Create the release with the notes file checked by check_release_notes.
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: false
          overwrite_files: true
          files: |
            release-files/*
