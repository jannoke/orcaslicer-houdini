name: Build RPM (Fedora)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-rpm-fedora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The source RPM, made once: every Fedora release below is rebuilt from it, and the release
  # publishes it for other Fedora versions (packaging/fedora/README.md).
  srpm:
    name: SRPM
    runs-on: [self-hosted, linux]
    container:
      image: fedora:44
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      # git before the checkout, so the checkout is a repository that git archive can pack.
      - name: Install tools
        run: dnf install -y git rpm-build

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Build SRPM
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/fedora/make_srpm.sh out

      - name: Upload SRPM
        uses: actions/upload-artifact@v7
        with:
          name: orcaslicer-bmcu-srpm-${{ github.sha }}
          path: out/srpm/*.src.rpm
          if-no-files-found: error

  rpm_fedora:
    name: RPM (fedora-${{ matrix.fedora_version }})
    needs: srpm
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        fedora_version: [42, 43, 44]
    container:
      image: fedora:${{ matrix.fedora_version }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DIST_ID: fedora${{ matrix.fedora_version }}

    steps:
      # The checkout is for the dependency build and its cache key; the RPM is built from the SRPM.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Download SRPM
        uses: actions/download-artifact@v8
        with:
          name: orcaslicer-bmcu-srpm-${{ github.sha }}
          path: srpm

      # The SRPM's BuildRequires are what build_linux.sh -u installs, plus the build tools.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          dnf install -y rpm-build 'dnf-command(builddep)' zstd
          dnf builddep -y srpm/*.src.rpm

      - name: Compute version
        run: |
          set -euo pipefail
          # From version.inc, not the tag: a release tag must equal v<version>-<label>,
          # and a tag publishes a tested dispatch build, so both name files the same.
          ver="$(sed -n 's/^set(SoftFever_VERSION "\(.*\)")/\1/p' version.inc)-$(sed -n 's/^set(FORK_RELEASE_LABEL "\(.*\)")/\1/p' version.inc)"
          echo "VER=$ver" >> "$GITHUB_ENV"

      # Size parallelism by RAM, not CPUs: deps compile lighter, so allow ~3 GB per job
      # (the spec sizes the Orca build itself the same way, ~4 GB per job).
      - name: Fedora - size deps build parallelism
        run: |
          set -euo pipefail
          mem_gb=$(awk '/MemAvailable/ {print int($2/1048576)}' /proc/meminfo)
          j=$(( mem_gb / 3 )); (( j < 1 )) && j=1; (( j > $(nproc) )) && j=$(nproc)
          echo "DEPS_JOBS=$j" >> "$GITHUB_ENV"
          echo "MemAvailable ${mem_gb} GB, nproc $(nproc): deps -j$j"

      # The deps take most of the job and only change with deps/ or the build
      # recipe. Saved as soon as they are built: actions/cache only saves when
      # the whole job succeeds. (No .git in the container checkout, so hashFiles.)
      - name: Fedora - restore deps cache
        id: deps_cache
        uses: actions/cache/restore@v5
        with:
          path: deps/build/OrcaSlicer_dep
          key: fedora${{ matrix.fedora_version }}-deps-${{ hashFiles('deps/**', 'build_linux.sh', 'scripts/linux.d/**') }}-v1

      - name: Fedora - build Orca dependencies
        if: steps.deps_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./build_linux.sh -drlL -j "${DEPS_JOBS}"

      - name: Fedora - save deps cache
        if: steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps_cache.outputs.cache-primary-key }}

      # Same source as the checkout, so the deps built from it above stand in for the ones the
      # spec would build (orca_deps_prefix).
      - name: Fedora - build RPM from the SRPM
        run: |
          set -euo pipefail
          rm -rf rpm out
          mkdir -p out
          rpmbuild --rebuild --define "_topdir ${PWD}/rpm" \
            --define "orca_deps_prefix ${PWD}/deps/build/OrcaSlicer_dep" srpm/*.src.rpm
          cp rpm/RPMS/x86_64/*.rpm "out/OrcaSlicer-BMCU_${DIST_ID}_x86_64_${VER}.rpm"

      - name: Fedora - checksums
        run: |
          set -euo pipefail
          (cd out && sha256sum * > "SHA256SUMS_${DIST_ID}.txt")

      - name: Upload artifacts (RPM Fedora)
        uses: actions/upload-artifact@v7
        with:
          name: orcaslicer-bmcu-rpm-${{ env.DIST_ID }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
